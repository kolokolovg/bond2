name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-package: jdk+fx
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache OpenJML
        uses: actions/cache@v4
        with:
          path: tools
          key: openjml-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml') }}
      - name: Check, mutation testing, formal verification
        run: ./gradlew check pitest openjmlProve -Pheadless=true --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports
