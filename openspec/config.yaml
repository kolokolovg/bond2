schema: spec-driven

context: |
  Артефакты, комментарии и Javadoc, сообщения пользователю и README пишутся
  на русском языке. Идентификаторы в коде и ключи настроек — на английском.
  Каждый Java-файл начинается с `// SPDX-License-Identifier: Apache-2.0`.

  Платформы: Linux, macOS, Windows. Любое решение, связанное с путями,
  файловой системой или блокировками, должно учитывать все три.

  Данные пользователя в SQLite нельзя терять и портить. Код не изменяет
  файл, который не распознан как БД приложения. Изменения в хранении и
  миграциях обязаны описывать поведение при сбое.

  Обязательные проверки до завершения задачи: `./gradlew check` (spotless,
  errorprone с NullAway, spotbugs, тесты, покрытие строк не ниже порога из
  gradle.properties). Для логики БД и настроек запускается также `pitest`.
  Код в `src/verified` проверяется `openjmlProve`; его контракты JML
  менять только вместе с доказательством. Тесты UI идут с `-Pheadless=true`.

rules:
  proposal:
    - Отмечать несовместимые изменения как **BREAKING**.
    - Перечислять затронутые существующие спеки точным именем из `openspec/specs/`.
    - Указывать, что выходит за рамки изменения.
  specs:
    - Одно требование описывает одно поведение; длиннее 500 символов — делить на несколько.
    - Крайние случаи выносить в сценарии, а не в текст требования.
    - Изменяя требование (MODIFIED), сохранять названия всех существующих сценариев.
  design:
    - Для каждого решения указывать рассмотренную альтернативу.
    - Для изменений хранилища и файлов описывать поведение при сбое и откат.
    - Для путей и файловых операций указывать поведение на Windows, macOS и Linux.
  tasks:
    - Каждая задача — не более двух часов работы с проверяемым результатом.
    - Для каждого изменения поведения предусматривать тесты, включая граничные случаи.
    - Последняя группа — обновление README и прогон проверок (`check`, при необходимости `pitest`).

operations:
  apply:
    guidance:
      - Не менять файлы вне области задач; форматирование выполняет spotless.
      - Отмечать задачу выполненной только после зелёных тестов её области.
